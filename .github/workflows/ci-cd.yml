
name: Portfolio CI/CD

# Déclenchement du workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # 1. INTÉGRATION CONTINUE (CI)
  # ==========================================
  quality:
    name: Tests, quality and build
    runs-on: ubuntu-latest

    steps:
      # Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      # Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # Vérifier la qualité du code
      - name: ESLint
        run: npx ng lint

      # Exécuter les tests unitaires
      - name: Unit tests
        run: npx ng test --watch=false

      # Installer Chromium pour Playwright
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Exécuter les tests E2E
      - name: E2E tests
        run: npx playwright test

      # Compiler Angular pour GitHub Pages
      - name: Production build
        run: |
          npx ng build \
            --configuration production \
            --base-href /MyPortfolio/ \
            --output-path dist/pages

      # Vérifier que le build a généré index.html
      - name: Verify build output
        run: test -f dist/pages/browser/index.html

      # Configurer GitHub Pages
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6

      # Préparer les fichiers pour le déploiement
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages/browser

  # ==========================================
  # 2. DÉPLOIEMENT CONTINU (CD)
  # ==========================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: quality

    # Déploiement uniquement sur main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
